name: Build APK

on:
  push:
    branches: [main]
    # Editing the channel list is a data change, not a code change — it must
    # not spend seven minutes rebuilding an identical APK.
    paths-ignore:
      - 'channels.json'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to publish the release below; everything else is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        # Errors and warnings still fail the build; info-level lints do not.
        # A future Flutter release deprecating some API must not stand between
        # the kid and a working APK.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # github.run_number increments once per Build APK run and never repeats,
      # which is exactly what a build number needs to be.
      - name: Derive version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        # CHANNELS_URL is derived from this repository, so a fork or rename
        # keeps working without editing lib/utils/config.dart. APP_VERSION is
        # passed in as well so the parent dashboard can show which build is
        # installed without a package-info plugin.
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=CHANNELS_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/channels.json

      # R8 writes the exact keep rules it wanted into this file. Without it,
      # each missing package costs a whole failed build to discover.
      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules-${{ github.run_number }}
          path: build/app/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kidtube-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Artifacts can only be downloaded by a logged-in GitHub user, which is
      # useless on a phone. A release asset has an open, permanent URL.
      # The `latest` tag is deliberately rolling — one release, always current.
      #
      # Two copies of the same APK go up on purpose: the numbered one so it is
      # obvious which build is in hand, and a fixed-name one so the link in the
      # README and in phone bookmarks never changes:
      #   https://github.com/<owner>/<repo>/releases/latest/download/kidtube.apk
      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          cp "$apk" "kidtube-$APP_VERSION.apk"
          cp "$apk" kidtube.apk

          notes=$(printf 'Сборка %s из коммита %s\n\nПрямая ссылка, всегда последняя (вход в GitHub не нужен):\nhttps://github.com/%s/releases/latest/download/kidtube.apk\n\nПеред установкой удалите предыдущую версию: подпись у каждой сборки своя.' \
            "$APP_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY")

          gh release create latest --title "Сборка $APP_VERSION" --notes "$notes" \
            || gh release edit latest --title "Сборка $APP_VERSION" --notes "$notes"

          # Drop earlier numbered APKs, otherwise the rolling release collects
          # one per build forever.
          gh release view latest --json assets --jq '.assets[].name' \
            | grep -E '^kidtube-[0-9.]+\.apk$' \
            | grep -v "^kidtube-$APP_VERSION\.apk$" \
            | while read -r stale; do
                gh release delete-asset latest "$stale" --yes || true
              done

          gh release upload latest "kidtube-$APP_VERSION.apk" kidtube.apk --clobber
