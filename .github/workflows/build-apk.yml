name: Build APK

on:
  push:
    branches: [main]
    # Editing the channel list is a data change, not a code change — it must
    # not spend seven minutes rebuilding an identical APK.
    paths-ignore:
      - 'channels.json'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to publish the release below; everything else is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        # Errors and warnings still fail the build; info-level lints do not.
        # A future Flutter release deprecating some API must not stand between
        # the kid and a working APK.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # github.run_number increments once per Build APK run and never repeats,
      # which is exactly what a build number needs to be.
      - name: Derive version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      # Restores the signing key from a repository secret. Absent it, the build
      # keeps working and falls back to the debug key — just without the
      # install-over-the-top behaviour.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret — falling back to the debug key."
            exit 0
          fi

          ks="$RUNNER_TEMP/kidtube.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"

          # Ask the keystore what its key is called instead of assuming.
          # Whoever produced the file decides the alias, and the name a
          # Windows export writes is not necessarily the one Java reads back —
          # which is exactly how a build failed with "No key with alias".
          alias=$(keytool -list -storetype PKCS12 -keystore "$ks" \
                    -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                  | grep -m1 'PrivateKeyEntry' | cut -d, -f1 | tr -d '[:space:]')

          if [ -z "$alias" ]; then
            echo "Could not read a private key from the keystore." >&2
            exit 1
          fi

          echo "KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "Signing with the stored release key, alias '$alias'."

      - name: Build release APK
        # KEY_ALIAS deliberately absent: it was detected from the keystore in
        # the previous step and lives in the job environment. Declaring it here
        # would shadow that with an empty secret.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # CHANNELS_URL is derived from this repository, so a fork or rename
        # keeps working without editing lib/utils/config.dart. APP_VERSION is
        # passed in as well so the parent dashboard can show which build is
        # installed without a package-info plugin.
        #
        # --split-per-abi produces one APK per processor architecture instead
        # of a single universal file. Since media_kit added libmpv, a universal
        # build carries four copies of it and weighs about 98 MB; a per-ABI one
        # is roughly half that, and every device only ever needs its own.
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=CHANNELS_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/channels.json

      # R8 writes the exact keep rules it wanted into this file. Without it,
      # each missing package costs a whole failed build to discover.
      - name: Upload R8 missing rules
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-missing-rules-${{ github.run_number }}
          path: build/app/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: kidtube-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      # Artifacts can only be downloaded by a logged-in GitHub user, which is
      # useless on a phone. A release asset has an open, permanent URL.
      # The `latest` tag is deliberately rolling — one release, always current.
      #
      # kidtube.apk is the 64-bit ARM build under a fixed name: that covers
      # every phone and tablet made in roughly the last decade, and keeps the
      # link in the README and in phone bookmarks working forever. The 32-bit
      # build goes up beside it, named, for anything older.
      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk" "kidtube-$APP_VERSION.apk"
          cp "$out/app-arm64-v8a-release.apk" kidtube.apk
          cp "$out/app-armeabi-v7a-release.apk" "kidtube-32bit-$APP_VERSION.apk"

          notes=$(printf 'Сборка %s из коммита %s\n\nПрямая ссылка, всегда последняя (вход в GitHub не нужен):\nhttps://github.com/%s/releases/latest/download/kidtube.apk\n\nЭто сборка для 64-битных устройств — подходит всем современным телефонам и планшетам. Для очень старых есть отдельный файл kidtube-32bit.\n\nПеред установкой удалите предыдущую версию: подпись у каждой сборки своя.' \
            "$APP_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY")

          gh release create latest --title "Сборка $APP_VERSION" --notes "$notes" \
            || gh release edit latest --title "Сборка $APP_VERSION" --notes "$notes"

          # Drop earlier numbered APKs, otherwise the rolling release collects
          # a set per build forever.
          gh release view latest --json assets --jq '.assets[].name' \
            | grep -E '^kidtube(-32bit)?-[0-9.]+\.apk$' \
            | grep -vE "^kidtube(-32bit)?-$APP_VERSION\.apk$" \
            | while read -r stale; do
                gh release delete-asset latest "$stale" --yes || true
              done

          gh release upload latest \
            "kidtube-$APP_VERSION.apk" \
            "kidtube-32bit-$APP_VERSION.apk" \
            kidtube.apk --clobber
