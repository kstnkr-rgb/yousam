name: Build APK

on:
  push:
    branches: [main]
    # Editing the channel list is a data change, not a code change — it must
    # not spend seven minutes rebuilding an identical APK.
    paths-ignore:
      - 'channels.json'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to publish the release below; everything else is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Errors and warnings still fail the build; info-level lints do not.
        # A future Flutter release deprecating some API must not stand between
        # the kid and a working APK.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        # CHANNELS_URL is derived from this repository, so a fork or rename
        # keeps working without editing lib/utils/config.dart.
        run: |
          flutter build apk --release \
            --dart-define=CHANNELS_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/channels.json

      - uses: actions/upload-artifact@v4
        with:
          name: kidtube-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Artifacts can only be downloaded by a logged-in GitHub user, which is
      # useless on a phone. A release asset has an open, permanent URL:
      #   https://github.com/<owner>/<repo>/releases/latest/download/kidtube.apk
      # The `latest` tag is deliberately rolling — one release, always current,
      # so the link in the README never changes.
      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kidtube.apk
          notes=$(printf 'Автосборка из коммита %s\n\nПрямая ссылка (вход в GitHub не нужен):\nhttps://github.com/%s/releases/latest/download/kidtube.apk' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          gh release create latest --title 'Последняя сборка' --notes "$notes" \
            || gh release edit latest --notes "$notes"
          gh release upload latest kidtube.apk --clobber
