name: safe_tube
description: A safe, YouTube-like video app for children with parental controls.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  # Parses the channel Atom feed used as the fallback video source.
  xml: ^6.5.0
  youtube_player_flutter: ^9.1.1
  # 3.1.0 carries "Fix: channel, playlist, videos apis" — the 2.x line's
  # channel-uploads scraping stopped returning anything against current
  # YouTube, which is why channels resolved but no videos ever appeared.
  youtube_explode_dart: ^3.1.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  timeago: ^3.7.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
