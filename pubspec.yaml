name: safe_tube
description: A safe, YouTube-like video app for children with parental controls.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  # Parses the channel Atom feed used as the fallback video source.
  xml: ^6.5.0
  # Plays the raw stream. Needed instead of the embedded YouTube player
  # because that one picks the resolution itself and cannot be told otherwise,
  # and because higher qualities arrive as separate video and audio tracks
  # that have to be played together.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  youtube_player_flutter: ^9.1.1
  # 3.1.0 carries "Fix: channel, playlist, videos apis" — the 2.x line's
  # channel-uploads scraping stopped returning anything against current
  # YouTube, which is why channels resolved but no videos ever appeared.
  youtube_explode_dart: ^3.1.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  timeago: ^3.7.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  path_provider: ^2.1.4
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icons are generated from a single source image during the CI build,
# so replacing the icon means replacing assets/icon.jpg and nothing else.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  # Legacy icon: the artwork edge to edge, since old launchers draw it as-is.
  image_path: "assets/icon_sam.png"
  min_sdk_android: 21
  # Adaptive icon: the launcher masks the foreground to its own shape and can
  # cut away the outer third, so this layer is the same artwork inset to 70% of
  # the canvas — otherwise the top of the hair would be shaved off. The
  # background matches the artwork's own near-white, so the square edge of the
  # inset image disappears into it.
  adaptive_icon_background: "#FAF9FA"
  adaptive_icon_foreground: "assets/icon_sam_adaptive.png"

flutter:
  uses-material-design: true
