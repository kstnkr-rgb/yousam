plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.safetube.safe_tube"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // NewPipeExtractor uses java.time, which only exists natively from
        // API 26. Desugaring keeps the app working down to minSdk.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.safetube.safe_tube"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // A stable signing key, supplied by CI from a repository secret. Without
    // one the build falls back to the debug key, which the build machine
    // regenerates every run — a different signature each time, so Android
    // refuses to install a new version over the old one and the app has to be
    // uninstalled first, taking its database with it.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            if (keystorePath) {
                storeFile = file(keystorePath)
                storeType = System.getenv('KEYSTORE_TYPE') ?: 'PKCS12'
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS') ?: 'kidtube'
                keyPassword = System.getenv('KEY_PASSWORD')
                        ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = System.getenv('KEYSTORE_PATH')
                    ? signingConfigs.release
                    : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Reads channel listings straight from YouTube. Used instead of the Dart
    // scraper, whose channel parsing has been broken upstream since YouTube
    // switched to the lockupViewModel layout.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
